name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required. Runs everywhere, including on a fork, with no host installation.
  # The integration tests that mount the real DeepSeek Harness services detect
  # the host through `test-support/dsh.js` and *skip* when it is absent, so this
  # job stays portable. It is honest about that: the step asserts the suite
  # exits 0 and prints its totals, and the host-backed job below is what
  # exercises the real seams.
  checks:
    name: typecheck and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The package itself has zero dependencies — that is a design property, not
      # an oversight — so the compiler is installed for the check rather than
      # declared as a runtime dependency.
      - name: Install TypeScript
        run: npm install --global typescript@6.0.3
      - name: Build the migrated TypeScript sources
        run: npm run build
      - name: Typecheck (strict checkJs)
        run: npm run typecheck
      - name: Unit, conformance, and portable integration tests
        run: node --test

  # Documentation health. Zero dependencies: the checker is POSIX sh and uses only
  # base utilities, so it runs on the stock runner. It fails on a broken relative
  # link, missing owner/last_reviewed front matter, a document absent from
  # docs/DOCUMENTATION-INDEX.md, or an unparsable last_reviewed date.
  docs:
    name: documentation health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, front matter, and index coverage
        run: ./scripts/check-docs.sh

  # Best-effort. Installs the pinned DeepSeek Harness host and runs the full
  # evidence chain, which is the real release gate: a throwaway profile install,
  # row composition, an execution proof against the installed artifact, and a
  # live mount. Round 7 made this job REQUIRED: it installs the one release the
  # package declares as verified, so a compatibility failure is a CI failure
  # rather than a warning (Batch 7 Phase 4). No other host version is claimed or
  # tested here. TypeScript is pinned so release correctness cannot depend on
  # whichever version the registry serves that day (Batch 7 Phase 5).
  with-host:
    name: full verification chain (verified host 0.2.1-alpha.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript
        run: npm install --global typescript@6.0.3
      - name: Install the verified host release
        run: npm install --global @deepseek-ai/dsh@0.2.1-alpha.1
      - name: Point the test loader at the installed host
        run: |
          DSH_PACKAGES="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai"
          test -d "$DSH_PACKAGES" || { echo "host layout not found at $DSH_PACKAGES"; exit 1; }
          echo "IEG_DSH_PACKAGES=$DSH_PACKAGES" >> "$GITHUB_ENV"
      - name: Full verification chain
        run: ./scripts/verify.sh