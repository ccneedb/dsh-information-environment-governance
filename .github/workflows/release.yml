name: Release artifact

# Builds the canonical npm tarball with `npm pack` and attaches it to the
# GitHub release, so a volunteer can install IEG with no git clone:
#
#   dsh plugin --profile ieg-test add \
#     "https://github.com/ccneedb/dsh-information-environment-governance/releases/download/v<version>/dsh-information-environment-governance-<version>.tgz"
#
# (or the equivalent `dsh plugin --profile ieg-test add "<tarball url>"`).
#
# Publication to the **npm registry is NOT performed and NOT authorised**: the
# package is publishable (no `private` flag) but publication is a release
# decision withheld until the model-backed gates pass and the publish target is
# chosen (ARCHITECTURE-SPEC §31.1, §34.2 Q5). The release asset is the
# distribution channel; do not add an `npm publish` step here.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (and release) to attach the tarball to
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  tarball:
    name: build and attach the npm tarball
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The package itself has zero runtime dependencies. The compiler is
      # installed for the build rather than declared as a runtime dependency,
      # matching the CI `checks` job.
      - name: Install the TypeScript compiler
        # Immutable install from the committed lockfile, so a released artifact is built
        # by the pinned compiler rather than whatever the registry serves that day (R8-06).
        run: npm ci --ignore-scripts

      - name: Build the generated sources
        run: npm run build

      # The documented release gate must run here, not only in CI: a tag used to be
      # able to receive an artifact without tests or verify.sh ever running (IEG-09).
      - name: Typecheck
        run: npm run typecheck

      - name: Test suite
        run: node --test

      - name: Install the verified host release
        run: npm install --global @deepseek-ai/dsh@0.2.1-rc.2

      - name: Install pnpm (pinned)
        run: npm install --global pnpm@12.9.1

      - name: Full verification chain (release gate)
        run: |
          DSH_PACKAGES="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai"
          test -d "$DSH_PACKAGES" || { echo "host layout not found at $DSH_PACKAGES"; exit 1; }
          IEG_DSH_PACKAGES="$DSH_PACKAGES" ./scripts/verify.sh

      # Release identity (IEG-01): the tag must name the package version, or the
      # artifact is attached under a name that denotes another tree.
      - name: Assert the tag names this package version
        run: |
          test -n "$TAG" || { echo "no tag to check"; exit 1; }
          EXPECTED="v$(node -p "require('./package.json').version")"
          test "$TAG" = "$EXPECTED" || { echo "tag $TAG does not name $EXPECTED"; exit 1; }
          echo "release identity: $TAG == $EXPECTED"

      # `prepack` asserts the required artifacts are present, so a broken or
      # unbuilt tree fails here rather than shipping a tarball that cannot mount.
      - name: Pack the npm tarball
        id: pack
        run: |
          npm pack
          TARBALL="$(ls -1 dsh-information-environment-governance-*.tgz | head -1)"
          test -n "$TARBALL" || { echo "npm pack produced no tarball"; exit 1; }
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "sha256: $(cat "$TARBALL.sha256")"

      - name: Assert the tarball carries the mountable plugin
        run: |
          TARBALL="${{ steps.pack.outputs.tarball }}"
          for f in package/lib/index.js package/lib/kernel/prompt-compiler.js package/cordis.patch.yml package/package.json; do
            tar tzf "$TARBALL" | grep -qx "$f" || { echo "missing from tarball: $f"; exit 1; }
          done
          echo "tarball contents verified"

      - name: Attach the tarball and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL="${{ steps.pack.outputs.tarball }}"
          test -n "$TAG" || { echo "no tag to attach to"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --clobber
          else
            gh release create "$TAG" "$TARBALL" "$TARBALL.sha256" \
              --title "dsh-information-environment-governance $TAG" --generate-notes
          fi
          echo "attached $TARBALL to release $TAG"
